[project]
name = "asset-ml-feasibility"
version = "0.1.0"
description = "Reproducible data prospection and feasibility pipeline for asset-maintenance ML workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pyarrow>=15.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "lxml>=5.0.0",
    "scikit-learn>=1.3.0",
    "spacy>=3.7.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "sentence-transformers>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
